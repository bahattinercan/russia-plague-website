name: ingest

# Cron ingest: kaynakları tarar, Neon Postgres'e yazar.
# DATABASE_URL secret'ı yoksa ingest JSON'a düşer (fail-safe) — site çalışmaya devam eder.
#
# TETİKLEYİCİLER — iki tane var, ikisi de aynı `concurrency: ingest` grubunda,
# yani üst üste binen istekler birikmez (1 çalışır + 1 kuyrukta bekler):
#
#  1) `schedule` (aşağıda) — YEDEK. GitHub'ın zamanlayıcısı ücretsiz katmanda
#     ağır kısıtlı: "her 10 dakika" pratikte saatte bire düşüyor, bazen hiç
#     çalışmıyor. Ölçüm: 2026-10-07'de 9 saatlik pencerede yalnızca 1 zamanlanmış
#     çalışma tetiklendi.
#  2) cron-job.org → workflow_dispatch API — ASIL tetikleyici, gerçek 10 dk kadansı.
#     Kurulum: docs/dispatch-tetikleme.md
#
# MALİYET: Bu repo PUBLIC olduğu için public repolarda Actions dakikaları
# sınırsızdır; 10 dk kadansı bedava. Repo tekrar PRIVATE yapılırsa Free plan
# 2.000 dk/ay verir ve 10 dk kadansı (~7.600 dk/ay) kotayı ~8 günde bitirir —
# o durumda kadansı 45–60 dk'ya çekin. Ayrıntı: docs/dispatch-tetikleme.md
#
# NOT: `schedule` yalnızca varsayılan daldaki (main) workflow dosyası için tetiklenir.
# Veri bayatladıysa `gh workflow run ingest.yml --ref main` ile elle çalıştırın.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency: ingest

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # TR çeviri: DEEPL_API_KEY (önerilir) veya OPENAI_API_KEY tanımlıysa o
      # sağlayıcı kullanılır; ikisi de yoksa anahtarsız Google katmanı devrededir.
      DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TRANSLATE_PROVIDER: ${{ vars.TRANSLATE_PROVIDER }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Bağımlılıklar
        run: npm ci

      - name: DB bağlantısı kontrolü
        run: npm run db:check

      - name: Ingest
        run: npm run ingest

      - name: Debug artifact (feed.json)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feed-snapshot
          path: data/feed.json
          retention-days: 7

      # Dead man's switch: ingest başarısız olursa (adaptör çökmesi, DB
      # erişilemezliği, --dry dışındaki herhangi bir hata) açık bir issue açılır.
      # Sessizce eski veri göstermek yerine görünür alarm üretir.
      - name: Dead man's switch
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Ingest başarısız — $(date -u +'%Y-%m-%d %H:%M UTC')"
          BODY="GitHub Actions ingest çalışması başarısız oldu.\n\n- Run: ${{ github.run_url }}\n- Commit: ${{ github.sha }}\n- Zaman: $(date -u +'%Y-%m-%d %H:%M:%S UTC')\n\nSite muhtemelen önceki snapshot'ı göstermeye devam ediyor. Logları kontrol edin."
          if gh issue list --label ingest-failure --state open --json | grep -q '"number"'; then
            gh issue comment "$(gh issue list --label ingest-failure --state open --json | head -1 | grep -o '"number": [0-9]*' | grep -o '[0-9]*')" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY" --label ingest-failure
          fi
